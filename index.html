<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./images/portfolio.png" type="image/png">
</head>

<body>
    <main class="app">
        <header class="hero">
            <p class="hero-kicker">MY DEVELOPER JOURNEY</p>

            <h1>Portfolio tracker</h1>

            <p class="hero-text">Moj osobni pregled projekata, tehnologija, statusa i vremena rada.</p>
        </header>
        <section class="stats-section">
            <div class="stat-card">
                <span>Ukupno</span>
                <strong id="total-projects">0</strong>
            </div>
            <div class="stat-card">
                <span>Završeno</span>
                <strong id="completed-projects">0</strong>
            </div>
            <div class="stat-card">
                <span>U izradi</span>
                <strong id="active-projects">0</strong>
            </div>
            <div class="stat-card">
                <span>Miruje</span>
                <strong id="testing-projects">0</strong>
            </div>

        </section>
        <section class="projects-section">

            <h2>Moji projekti</h2>

            <div class="view-controls">
                <button class="view-btn active-view" data-view="aktualno">Aktualno</button>
                <button class="view-btn" data-view="progres">Progres</button>
            </div>

            <div class="projects-list"></div>
            
        </section>

    </main>


    <script src="data.js"></script>
    <script src="levels.js"></script>
    <script src="app.js"></script>
    <script src="image-toggle.js"></script>
</body>

</html>
